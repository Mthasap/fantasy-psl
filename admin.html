<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy PSL — Admin Panel</title>

<style>

body{
font-family:Arial;
background:#0a0c0f;
color:white;
margin:0;
}

header{
background:#111418;
padding:15px 30px;
display:flex;
justify-content:space-between;
border-bottom:1px solid #252b34;
}

main{
max-width:1100px;
margin:auto;
padding:30px;
}

button{
padding:8px 14px;
border-radius:6px;
border:none;
cursor:pointer;
font-weight:bold;
}

.btn-green{background:#00e676;color:black}
.btn-blue{background:#2979ff;color:white}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

td,th{
padding:10px;
border-bottom:1px solid #252b34;
}

.score-input{
width:45px;
text-align:center;
}

</style>

</head>

<body>

<header>
<div><b>Fantasy PSL Admin</b></div>
<div id="gw-label">Loading GW...</div>
</header>

<main>

<h3>Add Fixture</h3>

<select id="home"></select> <select id="away"></select>

<input id="gw" type="number" placeholder="Gameweek">
<input id="kickoff" type="datetime-local">

<button class="btn-green" onclick="addFixture()">Add Fixture</button>

<hr style="margin:30px 0">

<h3>Current Gameweek Fixtures</h3>

<table>

<thead>
<tr>
<th>Home</th>
<th>Score</th>
<th>Away</th>
<th>Kickoff</th>
<th>Status</th>
<th>Save</th>
</tr>
</thead>

<tbody id="fixtures"></tbody>

</table>

</main>

<script>

const SUPABASE_URL="https://vkjzwpbkqcckrjwsqxgk.supabase.co"

const SUPABASE_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZranp3cGJrcWNja3Jqd3NxeGdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxNDczMTgsImV4cCI6MjA4ODcyMzMxOH0.9KflAQVrz5JgrghVFQ4j3e1x9GKHA5AsGygeaRi7qqU"

const TEAMS=[
"Mamelodi Sundowns",
"Orlando Pirates",
"Kaizer Chiefs",
"Stellenbosch FC",
"AmaZulu FC",
"Chippa United",
"Golden Arrows",
"Sekhukhune United",
"TS Galaxy",
"Polokwane City",
"Marumo Gallants",
"Richards Bay",
"Magesi FC",
"Durban City",
"Orbit College FC",
"Siwelele"
]

let CURRENT_GW=null
let FIXTURES=[]

function populateTeams(){

const home=document.getElementById("home")
const away=document.getElementById("away")

home.innerHTML=TEAMS.map(t=>`<option>${t}</option>`).join("")
away.innerHTML=TEAMS.map(t=>`<option>${t}</option>`).join("")

}

async function sb(method,table,body,query){

const url=SUPABASE_URL+"/rest/v1/"+table+(query?"?"+query:"")

const res=await fetch(url,{
method,
headers:{
apikey:SUPABASE_ANON,
Authorization:"Bearer "+SUPABASE_ANON,
"Content-Type":"application/json"
},
body:body?JSON.stringify(body):null
})

const text=await res.text()

return text?JSON.parse(text):null

}

async function loadGW(){

const data=await sb(
"GET",
"gameweeks",
null,
"is_current=eq.true&select=number"
)

CURRENT_GW=data[0].number

document.getElementById("gw-label").innerText="Gameweek "+CURRENT_GW

}

async function loadFixtures(){

const data=await sb(
"GET",
"fixtures",
null,
"gameweek=eq."+CURRENT_GW+"&order=kickoff_at.asc"
)

FIXTURES=data||[]

renderFixtures()

}

function renderFixtures(){

const tbody=document.getElementById("fixtures")

tbody.innerHTML=""

FIXTURES.forEach(f=>{

const tr=document.createElement("tr")

tr.innerHTML=`
<td>${f.home_team}</td>

<td>
<input class="score-input" id="hg_${f.id}" value="${f.home_score||0}">
-
<input class="score-input" id="ag_${f.id}" value="${f.away_score||0}">
</td>

<td>${f.away_team}</td>

<td>${f.kickoff_at||"-"}</td>

<td>${f.status}</td>

<td>
<button class="btn-blue" onclick="saveScore(${f.id})">
Save
</button>
</td>
`

tbody.appendChild(tr)

})

}

async function saveScore(id){

const hg=document.getElementById("hg_"+id).value
const ag=document.getElementById("ag_"+id).value

await sb(
"PATCH",
"fixtures",
{
home_score:hg,
away_score:ag,
status:"FT"
},
"id=eq."+id
)

loadFixtures()

}

async function addFixture(){

const home=document.getElementById("home").value
const away=document.getElementById("away").value
const gw=document.getElementById("gw").value
const kickoff=document.getElementById("kickoff").value

await sb(
"POST",
"fixtures",
{
home_team:home,
away_team:away,
gameweek:gw,
kickoff_at:kickoff,
status:"NS"
}
)

loadFixtures()

}

async function init(){

populateTeams()

await loadGW()

await loadFixtures()

}

init()

</script>

</body>
</html>
